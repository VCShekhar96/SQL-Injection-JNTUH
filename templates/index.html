
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SQL Injection Lab</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <h2>SQL Injection Lab</h2>
        <p>Educational Login Demonstration</p>

        <form action="{{ url_for('login') }}" method="POST">

            <input type="text"
                   name="username"
                   placeholder="Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <label for="mode">Select Login Mode:</label>

            <select name="mode" id="mode" required>
                <option value="vulnerable">
                    Vulnerable Login
                </option>

                <option value="secure">
                    Secure Login
                </option>
            </select>

            <button type="submit">Login</button>

        </form>
    </div>
</body>
</html>
