
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Authentication Result</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <h2>Authentication Result</h2>

        <h3>{{ message }}</h3>

        <p>Login Mode: {{ mode }}</p>

        {% if users %}
            <h4>Matched Accounts</h4>

            {% for user in users %}
                <p>{{ user }}</p>
            {% endfor %}
        {% endif %}

        <a href="{{ url_for('home') }}">Back to Login</a>
    </div>
</body>
</html>
